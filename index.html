function fmt(n){ return '$' + n.toFixed(1); }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

// Plain-language verdict from just two independent facts: is price cheap/expensive
// relative to today's volume-weighted average price, and is one side of the market
// (longs or shorts) visibly overloaded per the funding rate.
function buildSimpleVerdict(vwapDeviation, fundingRate){
  const cheap = vwapDeviation < -0.003, expensive = vwapDeviation > 0.003;
  const longCrowded = fundingRate > 0.0003, shortCrowded = fundingRate < -0.0003;
  if(cheap && shortCrowded) return { text: 'ETH дешевле дневного VWAP, и шорты явно перегружены по funding — короткий сквиз сейчас вероятнее, чем продолжение падения.', cls:'long' };
  if(expensive && longCrowded) return { text: 'ETH дороже дневного VWAP, и лонги явно перегружены по funding — коррекция сейчас вероятнее, чем продолжение роста.', cls:'short' };
  if(cheap) return { text: 'ETH торгуется ниже дневного VWAP — просто дешёвая для сегодняшнего дня зона, явного перекоса в позициях нет.', cls:'neutral' };
  if(expensive) return { text: 'ETH торгуется выше дневного VWAP — просто дорогая для сегодняшнего дня зона, явного перекоса в позициях нет.', cls:'neutral' };
  if(longCrowded) return { text: 'Цена у дневного VWAP, но лонги явно перегружены по funding — риск смещён в сторону лонгов, агрессивно покупать здесь рискованно.', cls:'short' };
  if(shortCrowded) return { text: 'Цена у дневного VWAP, но шорты явно перегружены по funding — риск смещён в сторону шортов, агрессивно продавать здесь рискованно.', cls:'long' };
  return { text: 'Ничего экстремального: цена у дневного VWAP, funding нейтрален, позиционирование сбалансировано.', cls:'neutral' };
}

function ema(values, period){
  const k = 2 / (period + 1);
  let arr = [values[0]];
  for(let i=1;i<values.length;i++) arr.push(values[i]*k + arr[i-1]*(1-k));
  return arr[arr.length-1];
}
function emaSeries(values, period){
  const k = 2 / (period + 1);
  let arr = [values[0]];
  for(let i=1;i<values.length;i++) arr.push(values[i]*k + arr[i-1]*(1-k));
  return arr;
}

function computeRSISeries(closes, period){
  const gains=[], losses=[];
  for(let i=1;i<closes.length;i++){
    const d = closes[i]-closes[i-1];
    gains.push(Math.max(d,0)); losses.push(Math.max(-d,0));
  }
  const rsi = new Array(closes.length).fill(null);
  if(gains.length < period) return rsi;
  let avgGain = gains.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let avgLoss = losses.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let rs = avgLoss===0?100:avgGain/avgLoss;
  rsi[period] = 100-(100/(1+rs));
  for(let i=period;i<gains.length;i++){
    avgGain = (avgGain*(period-1)+gains[i])/period;
    avgLoss = (avgLoss*(period-1)+losses[i])/period;
    rs = avgLoss===0?100:avgGain/avgLoss;
    rsi[i+1] = 100-(100/(1+rs));
  }
  return rsi;
}

function findPivotIdx(values, l, r, type){
  const idxs=[];
  for(let i=l;i<values.length-r;i++){
    let ok=true;
    for(let j=i-l;j<=i+r;j++){
      if(j===i) continue;
      if(type==='high' && values[j]>=values[i]) ok=false;
      if(type==='low' && values[j]<=values[i]) ok=false;
    }
    if(ok) idxs.push(i);
  }
  return idxs;
}

function detectDivergence(closes, rsi){
  const hi = findPivotIdx(closes,2,2,'high');
  const lo = findPivotIdx(closes,2,2,'low');
  if(hi.length>=2){
    const i1=hi[hi.length-2], i2=hi[hi.length-1];
    if(rsi[i1]!==null && rsi[i2]!==null && closes[i2]>closes[i1] && rsi[i2]<rsi[i1]) return -1;
  }
  if(lo.length>=2){
    const i1=lo[lo.length-2], i2=lo[lo.length-1];
    if(rsi[i1]!==null && rsi[i2]!==null && closes[i2]<closes[i1] && rsi[i2]>rsi[i1]) return 1;
  }
  return 0;
}

function computeATR(highs, lows, closes, period){
  const trs=[];
  for(let i=1;i<highs.length;i++){
    trs.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  }
  const recent = trs.slice(-period);
  return recent.reduce((a,b)=>a+b,0)/recent.length;
}

function clusterLevels(levels, thresholdPct){
  if(levels.length===0) return [];
  const sorted=[...levels].sort((a,b)=>a-b);
  const clusters=[[sorted[0]]];
  for(let i=1;i<sorted.length;i++){
    const last = clusters[clusters.length-1];
    const avg = last.reduce((a,b)=>a+b,0)/last.length;
    if(Math.abs(sorted[i]-avg)/avg < thresholdPct) last.push(sorted[i]);
    else clusters.push([sorted[i]]);
  }
  return clusters.map(c=>c.reduce((a,b)=>a+b,0)/c.length);
}

function pickTargets(levels, price, g1, g2, g3, dir){
  const far = levels.filter(l => Math.abs(l-price) >= g1);
  const tp1 = far[0] ?? (price + dir*g1);
  let tp2 = far.find(l => Math.abs(l-price) >= g2 && l!==tp1);
  if(tp2===undefined) tp2 = tp1 + dir*g2*0.6;
  let tp3 = far.find(l => Math.abs(l-price) >= g3 && l!==tp1 && l!==tp2);
  if(tp3===undefined) tp3 = tp2 + dir*g3*0.6;
  return [tp1,tp2,tp3];
}

let state = null; // holds everything computed on last fetch

/* ---------- REAL-TIME ORDER FLOW (public Binance WebSockets, no API key) ---------- */
let wsSpot = null, wsFutures = null;
let cvdWindow = [];   // live aggTrade ticks: {t, delta, vol} — delta>0 = buyer aggressor
let depthBook = { bids: [], asks: [] }; // live top-20 order book snapshot
let liqWindow = [];   // live forced-liquidation events: {t, side, notional}
const CVD_WINDOW_MS = 10 * 60 * 1000;  // rolling tape window for CVD
const LIQ_WINDOW_MS = 60 * 60 * 1000;  // rolling window for liquidation pressure

function pruneWindow(arr, ms){
  const cutoff = Date.now() - ms;
  while(arr.length && arr[0].t < cutoff) arr.shift();
}

function connectStreams(){
  // Spot tape (aggTrade) + top-of-book depth — real order flow, updates every trade/second.
  try{
    wsSpot = new WebSocket('wss://stream.binance.com:9443/stream?streams=ethusdt@aggTrade/ethusdt@depth20@1000ms');
    wsSpot.onmessage = (ev) => {
      let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
      if(msg.stream === 'ethusdt@aggTrade'){
        const d = msg.data;
        const qty = parseFloat(d.q);
        const delta = d.m ? -qty : qty; // m:true -> buyer is maker -> the aggressor sold
        cvdWindow.push({ t: d.T || Date.now(), delta, vol: qty });
        pruneWindow(cvdWindow, CVD_WINDOW_MS);
      } else if(msg.stream === 'ethusdt@depth20@1000ms'){
        const d = msg.data;
        depthBook.bids = d.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
        depthBook.asks = d.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
      }
    };
    wsSpot.onclose = () => { setTimeout(connectStreams, 4000); };
    wsSpot.onerror = () => { try{ wsSpot.close(); }catch(e){} };
  }catch(e){}

  // Futures forced-liquidation feed — real liquidations, no key required.
  try{
    wsFutures = new WebSocket('wss://fstream.binance.com/ws/ethusdt@forceOrder');
    wsFutures.onmessage = (ev) => {
      let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
      const o = msg.o;
      if(!o) return;
      const notional = parseFloat(o.q) * parseFloat(o.ap || o.p);
      liqWindow.push({ t: o.T || Date.now(), side: o.S, notional });
      pruneWindow(liqWindow, LIQ_WINDOW_MS);
    };
    wsFutures.onclose = () => { setTimeout(connectStreams, 6000); };
    wsFutures.onerror = () => { try{ wsFutures.close(); }catch(e){} };
  }catch(e){}
}

// Net taker buy/sell pressure from the live tape. Returns null until enough ticks have arrived.
function realCVDScore(){
  pruneWindow(cvdWindow, CVD_WINDOW_MS);
  if(cvdWindow.length < 20) return null;
  const net = cvdWindow.reduce((s,x) => s + x.delta, 0);
  const vol = cvdWindow.reduce((s,x) => s + x.vol, 0) || 1;
  return clamp(net / (vol * 0.35), -1, 1);
}

// Resting bid vs ask size in the live top-20 order book. Returns null until the book has loaded.
function bookImbalanceScore(){
  if(!depthBook.bids.length || !depthBook.asks.length) return null;
  const bidQty = depthBook.bids.reduce((s,b) => s + b[1], 0);
  const askQty = depthBook.asks.reduce((s,a) => s + a[1], 0);
  return clamp((bidQty - askQty) / (bidQty + askQty || 1), -1, 1);
}

// Net forced-liquidation pressure. BUY-side liquidations = shorts squeezed (bullish);
// SELL-side = longs rekt (bearish). Requires some minimum notional to avoid noise.
function liquidationPressureScore(){
  pruneWindow(liqWindow, LIQ_WINDOW_MS);
  if(!liqWindow.length) return 0;
  let buyLiq = 0, sellLiq = 0;
  liqWindow.forEach(x => { if(x.side === 'BUY') buyLiq += x.notional; else sellLiq += x.notional; });
  const total = buyLiq + sellLiq;
  if(total < 5000) return 0;
  return clamp((buyLiq - sellLiq) / total, -1, 1);
}

async function fetchLiveData(){
  try{
    const [klRes, structRes, h4Res, oiRes, fundRes] = await Promise.all([
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=15m&limit=80'),
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1h&limit=200'),
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=4h&limit=100'),
      fetch('https://fapi.binance.com/futures/data/openInterestHist?symbol=ETHUSDT&period=15m&limit=30').catch(()=>null),
      fetch('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=ETHUSDT').catch(()=>null)
    ]);
    if(!klRes.ok || !structRes.ok || !h4Res.ok) throw new Error('klines fail');
    const klines = await klRes.json();
    const structKlines = await structRes.json();
    const h4Klines = await h4Res.json();

    let oiHist = null, funding = null;
    try{ if(oiRes && oiRes.ok) oiHist = await oiRes.json(); }catch(e){}
    try{ if(fundRes && fundRes.ok) funding = await fundRes.json(); }catch(e){}

    const closes15 = klines.map(k=>parseFloat(k[4]));
    const highs15 = klines.map(k=>parseFloat(k[2]));
    const lows15 = klines.map(k=>parseFloat(k[3]));
    const closes1h = structKlines.map(k=>parseFloat(k[4]));
    const highs1h = structKlines.map(k=>parseFloat(k[2]));
    const lows1h = structKlines.map(k=>parseFloat(k[3]));
    const closes4h = h4Klines.map(k=>parseFloat(k[4]));
    const price = closes15[closes15.length-1];

    /* ---------- TREND (Direction Engine: 15m/1h/4h EMA alignment) ---------- */
    function tfBias(closes, sP, lP){
      const eS = ema(closes.slice(-Math.max(sP*3,20)), sP);
      const eL = ema(closes.slice(-Math.max(lP*3,40)), lP);
      return (eS-eL)/eL;
    }
    const bias15 = tfBias(closes15,6,20), bias1h = tfBias(closes1h,6,20), bias4h = tfBias(closes4h,6,20);
    const trendScore = clamp((bias15*0.2 + bias1h*0.35 + bias4h*0.45)*3000, -1, 1);

    /* ---------- STRUCTURE (swing levels + breakout/retest) ---------- */
    function pivots(highs, lows){
      const ph=[], pl=[];
      for(let i=3;i<highs.length-3;i++){
        let isH=true, isL=true;
        for(let j=i-3;j<=i+3;j++){ if(j===i) continue; if(highs[j]>=highs[i]) isH=false; if(lows[j]<=lows[i]) isL=false; }
        if(isH) ph.push(highs[i]); if(isL) pl.push(lows[i]);
      }
      return {ph, pl};
    }
    const {ph, pl} = pivots(highs1h, lows1h);
    const resistances = clusterLevels(ph,0.0025).filter(l=>l>price).sort((a,b)=>a-b);
    const supports = clusterLevels(pl,0.0025).filter(l=>l<price).sort((a,b)=>b-a);

    // breakout check: did price close beyond the 20-bar (1h) range recently?
    const rangeWindow = closes1h.slice(-20);
    const rangeHigh = Math.max(...highs1h.slice(-20));
    const rangeLow = Math.min(...lows1h.slice(-20));
    let structureScore;
    if(price >= rangeHigh*0.999) structureScore = 1; // fresh breakout up
    else if(price <= rangeLow*1.001) structureScore = -1; // fresh breakdown
    else {
      const posInRange = (price-rangeLow)/(rangeHigh-rangeLow || 1);
      structureScore = clamp((posInRange-0.5)*1.6, -1, 1); // upper half of range = mild long lean, lower = short
    }

    /* ---------- MOMENTUM (EMA + RSI + ROC + divergence) ---------- */
    const roc = (closes15[closes15.length-1]-closes15[closes15.length-11])/closes15[closes15.length-11];
    const momentumRoc = clamp(roc*3000, -1, 1);
    const rsiSeries = computeRSISeries(closes15,14);
    const rsiLast = rsiSeries[rsiSeries.length-1];
    const rsiCentered = rsiLast!==null ? (rsiLast-50)/50 : 0;
    const divergence = detectDivergence(closes15, rsiSeries);
    const momentumScore = clamp(momentumRoc*0.45 + divergence*0.4 + rsiCentered*0.15, -1, 1);

    /* ---------- FLOW (OI + price, real live CVD, funding, real live liquidations) ---------- */
    let oiLabel = 'нет данных';
    let flowFromOI = 0;
    if(oiHist && oiHist.length > 5){
      const oiStart = parseFloat(oiHist[0].sumOpenInterest);
      const oiEnd = parseFloat(oiHist[oiHist.length-1].sumOpenInterest);
      const oiChangePct = (oiEnd-oiStart)/oiStart;
      const lookback = oiHist.length;
      const pStart = closes15[Math.max(0, closes15.length-1-lookback)];
      const priceChangePct = (price-pStart)/pStart;
      if(priceChangePct>0 && oiChangePct>0) { flowFromOI=1; oiLabel='новые лонги'; }
      else if(priceChangePct>0 && oiChangePct<=0){ flowFromOI=0.4; oiLabel='шорт-каверинг'; }
      else if(priceChangePct<0 && oiChangePct>0){ flowFromOI=-1; oiLabel='новые шорты'; }
      else { flowFromOI=-0.4; oiLabel='закрытие лонгов'; }
    }

    // Real-time CVD from the live aggTrade tape (buyer/seller aggressor flag).
    // Falls back to the kline taker-buy/sell approximation until enough live ticks arrive.
    const liveCvd = realCVDScore();
    let cvdScore;
    if(liveCvd !== null){
      cvdScore = liveCvd;
    } else {
      const recentK = klines.slice(-20);
      let cum=0; const cvdSeries=[];
      recentK.forEach(k=>{
        const vol=parseFloat(k[5]), buy=parseFloat(k[9]); const sell=vol-buy;
        cum += (buy-sell); cvdSeries.push(cum);
      });
      const volSum = recentK.reduce((s,k)=>s+parseFloat(k[5]),0) || 1;
      cvdScore = clamp((cvdSeries[cvdSeries.length-1]-cvdSeries[0])/(volSum*0.3), -1, 1);
    }

    let fundingComp = 0;
    if(funding && funding.lastFundingRate){
      fundingComp = clamp(parseFloat(funding.lastFundingRate)*400, -1, 1);
    }

    // Real-time forced-liquidation pressure from the live futures stream.
    const liqScore = liquidationPressureScore();

    const flowScore = clamp(flowFromOI*0.40 + cvdScore*0.35 + fundingComp*0.10 + liqScore*0.15, -1, 1);

    /* ---------- LIQUIDITY (structural magnet + real live order-book imbalance) ---------- */
    let atr1h = computeATR(highs1h, lows1h, closes1h, 14);
    let structMagnet = 0;
    if(resistances[0] && supports[0]){
      const distRes = (resistances[0]-price)/atr1h;
      const distSup = (price-supports[0])/atr1h;
      structMagnet = clamp((distSup-distRes)*0.35, -1, 1); // closer resistance -> price more likely to test it -> long lean, and vice versa
    }
    // Real resting bid vs ask size from the live depth20 stream. Falls back to the
    // structural-only estimate until the book has loaded.
    const bookScore = bookImbalanceScore();
    const liquidityScore = bookScore !== null
      ? clamp(structMagnet*0.5 + bookScore*0.5, -1, 1)
      : structMagnet;

    /* ---------- FINAL SCORE (weighted vote) ---------- */
    const weights = { trend:0.20, structure:0.20, momentum:0.20, flow:0.20, liquidity:0.10 };
    const totalW = Object.values(weights).reduce((a,b)=>a+b,0);
    const finalRaw = (trendScore*weights.trend + structureScore*weights.structure + momentumScore*weights.momentum + flowScore*weights.flow + liquidityScore*weights.liquidity) / totalW;
    const pressure = clamp(Math.round(50 + finalRaw*50), 0, 100);

    /* ---------- TIME ENGINE (qualitative freshness of the setup) ---------- */
    const rocPrev = (closes15[closes15.length-11]-closes15[closes15.length-21])/closes15[closes15.length-21];
    const decelerating = Math.abs(roc) < Math.abs(rocPrev)*0.6;
    const ema1h20 = ema(closes1h.slice(-60), 20);
    const extension = Math.abs(price-ema1h20)/atr1h;
    let timeLabel;
    if(decelerating && extension > 1.2) timeLabel = 'Импульс слабеет, сценарий уже не свежий — входить агрессивно поздно.';
    else if(!decelerating && extension < 0.8) timeLabel = 'Сценарий свежий, движение только набирает ход.';
    else timeLabel = 'Сценарий в развитии, ничего экстремального по срокам.';

    /* ---------- ENTRY ENGINE ---------- */
    const isLong = pressure >= 50;
    let entryState, entryZone;
    if(extension <= 1.2){
      entryState = { text: 'Сейчас', cls: 'now' };
      entryZone = 'у текущей цены';
    } else {
      entryState = { text: 'Поздний', cls: 'late' };
      if(isLong){
        const target = supports[0] ?? (price - atr1h*0.8);
        entryZone = fmt(target) + '–' + fmt(target + atr1h*0.3);
      } else {
        const target = resistances[0] ?? (price + atr1h*0.8);
        entryZone = fmt(target - atr1h*0.3) + '–' + fmt(target);
      }
    }

    /* ---------- SIMPLE MODE (VWAP deviation + funding overload, in plain language) ---------- */
    const todayStartMs = new Date().setUTCHours(0,0,0,0);
    const todayKlines1h = structKlines.filter(k => k[0] >= todayStartMs);
    let vwap = price;
    if(todayKlines1h.length){
      let pvSum = 0, vSum = 0;
      todayKlines1h.forEach(k => {
        const h=parseFloat(k[2]), l=parseFloat(k[3]), c=parseFloat(k[4]), v=parseFloat(k[5]);
        const typical = (h+l+c)/3;
        pvSum += typical*v; vSum += v;
      });
      if(vSum > 0) vwap = pvSum/vSum;
    }
    const vwapDeviation = (price-vwap)/vwap;
    const dayFundingRate = (funding && funding.lastFundingRate) ? parseFloat(funding.lastFundingRate) : 0;
    const simpleVerdict = buildSimpleVerdict(vwapDeviation, dayFundingRate);

    state = {
      price, pressure, isLong,
      blocks: { trend: trendScore, structure: structureScore, momentum: momentumScore, flow: flowScore, liquidity: liquidityScore, liquidations: liqScore },
      resistances, supports, atr1h,
      entryState, entryZone, timeLabel,
      vwap, vwapDeviation, dayFundingRate, simpleVerdict
    };

    priceDisplay.textContent = price.toFixed(2);
    liveDot.className = 'live-dot on';
    liveStatus.textContent = 'Live · Binance ETH';
    liveTime.textContent = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    scanBtn.disabled = false;
    scanBtn.textContent = 'Сканировать → выдать сигнал';
    return true;
  }catch(err){
    liveDot.className = 'live-dot off';
    liveStatus.textContent = 'Нет связи с биржей';
    scanBtn.disabled = true;
    scanBtn.textContent = 'Нет данных';
    return false;
  }
}

function labelFor(score){
  if(score > 0.12) return 'long';
  if(score < -0.12) return 'short';
  return 'neutral';
}

function renderBlockRow(blocks){
  const blockNames = { trend:'Trend', structure:'Structure', momentum:'Momentum', flow:'Flow', liquidity:'Liquidity', liquidations:'Liquid.' };
  const blockRow = document.getElementById('blockRow');
  blockRow.innerHTML = '';
  Object.keys(blockNames).forEach(key=>{
    const dir = labelFor(blocks[key]);
    const chip = document.createElement('div');
    chip.className = 'block-chip ' + dir;
    const val = dir==='long' ? 'LONG' : dir==='short' ? 'SHORT' : 'НЕЙТР';
    chip.innerHTML = `<div class="bk-name">${blockNames[key]}</div><div class="bk-val">${val}</div>`;
    blockRow.appendChild(chip);
  });
}

function runScan(){
  if(!state) return;
  const { price, pressure, isLong, blocks, resistances, supports, atr1h, entryState, entryZone, timeLabel, simpleVerdict } = state;
  const strength = Math.abs(pressure-50)/50;
  const scorePct = Math.round(60 + strength*35);

  signalCard.className = 'signal-card ' + (isLong ? 'long' : 'short');
  sigWord.textContent = isLong ? 'LONG' : 'SHORT';
  sigScore.textContent = scorePct + '%';

  renderBlockRow(blocks);

  const simpleBox = document.getElementById('simpleVerdict');
  simpleBox.className = 'simple-verdict ' + simpleVerdict.cls;
  simpleBox.textContent = simpleVerdict.text;

  const agreeBadge = document.getElementById('agreeBadge');
  const fullDir = isLong ? 'long' : 'short';
  if(simpleVerdict.cls === 'neutral'){
    agreeBadge.classList.remove('show', 'match', 'mismatch');
  } else if(simpleVerdict.cls === fullDir){
    agreeBadge.className = 'agree-badge show match';
    agreeBadge.textContent = '✓ Полная модель и грубый сигнал совпадают';
  } else {
    agreeBadge.className = 'agree-badge show mismatch';
    agreeBadge.textContent = '⚠ Модели расходятся — будь внимательнее';
  }

  document.getElementById('entryState').textContent = entryState.text;
  document.getElementById('entryState').className = entryState.cls;
  document.getElementById('entryZone').textContent = entryZone;

  const g1 = atr1h*0.6, g2 = atr1h*1.3, g3 = atr1h*2.2, slGap = atr1h*0.7;
  let tp1,tp2,tp3,sl;
  if(isLong){
    [tp1,tp2,tp3] = pickTargets(resistances, price, g1,g2,g3, 1);
    const validSup = supports.filter(l => Math.abs(l-price) >= slGap);
    sl = validSup[0] ? validSup[0]*0.998 : price - slGap;
    document.getElementById('invalidation').textContent = 'ниже ' + fmt(sl);
  } else {
    [tp1,tp2,tp3] = pickTargets(supports, price, g1,g2,g3, -1);
    const validRes = resistances.filter(l => Math.abs(l-price) >= slGap);
    sl = validRes[0] ? validRes[0]*1.002 : price + slGap;
    document.getElementById('invalidation').textContent = 'выше ' + fmt(sl);
  }

  document.getElementById('tp1').textContent = fmt(tp1);
  document.getElementById('tp2').textContent = fmt(tp2);
  document.getElementById('tp3').textContent = fmt(tp3);
  document.getElementById('sl').textContent = fmt(sl);
  document.getElementById('timeNote').innerHTML = timeLabel;

  result.classList.add('show');
}

scanBtn.addEventListener('click', runScan);
connectStreams();
fetchLiveData();
setInterval(fetchLiveData, 20000);

/* ---- PWA install prompt ---- */
let deferredPrompt = null;
const installHint = document.getElementById('installHint');
const installBtn = document.getElementById('installBtn');
const installText = document.getElementById('installText');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installHint.classList.add('show');
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installHint.classList.remove('show');
});
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (isIOS && !isStandalone) {
  installText.textContent = 'Установи: "Поделиться" → "На экран Домой" 📲';
  installBtn.style.display = 'none';
  installHint.classList.add('show');
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
