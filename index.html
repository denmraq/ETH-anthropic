<style>
  :root{
    --bg: #05070a;
    --panel: #0d1218;
    --panel-2: #10161d;
    --line: #1e2831;
    --long: #33ffb0;
    --long-dim: #0f4a38;
    --short: #ff4d6d;
    --short-dim: #4a1522;
    --neutral: #8a97a3;
    --text: #e8edf2;
    --text-dim: #7d8b96;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;

  }
  .wrap{ max-width: 480px; margin: 0 auto; }

  header{ margin-bottom: 18px; }
  .eyebrow{
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.02em;
    display:flex; align-items:center; gap:8px; margin-bottom:6px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--long); box-shadow:0 0 8px var(--long); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: 26px; line-height:1.1; letter-spacing:-0.01em;
  }
  h1 span{ color: var(--long); }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }

  label{ display:block; font-size:11px; color: var(--text-dim); margin-bottom:6px; }
  .price-row{ display:flex; align-items:center; gap:10px; }
  .price-row span{ font-family:'Space Grotesk',sans-serif; font-size:18px; color: var(--text-dim); }

  .slider-block{ margin-top:14px; }
  .slider-head{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .slider-head b{ color: var(--text); font-size:12px; }
  input[type=range]{
    width:100%; -webkit-appearance:none; height:6px; border-radius:4px;
    background: linear-gradient(90deg, var(--short) 0%, var(--line) 50%, var(--long) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;

  }
  .scale{ display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim); margin-top:4px; }

  .live-row{
    display:flex; align-items:center; gap:8px; font-size:11px; color: var(--text-dim);
    margin-bottom:12px;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:#555; flex-shrink:0; }
  .live-dot.on{ background: var(--long); box-shadow:0 0 8px var(--long); animation: pulse 1.6s infinite; }
  .live-dot.off{ background: var(--short); box-shadow:0 0 8px var(--short); }
  .live-time{ margin-left:auto; }

  .price-display{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Space Grotesk', sans-serif; font-weight:700;

  button.scan{
    width:100%; margin-top:16px; padding:15px;

    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:0.01em; cursor:pointer;
    transition: transform .08s ease;
  }
  button.scan:active{ transform: scale(0.98); }
  button.scan:disabled{ opacity:0.5; cursor:default; }

  .install-hint{
    display:none; align-items:center; gap:10px;
    background: var(--panel-2); border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:12px; font-size:12px; color: var(--text-dim); line-height:1.5;
  }
  .install-hint.show{ display:flex; }
  .install-hint button{
    flex-shrink:0; background: var(--long); color:#00291d; border:none;
    padding:8px 12px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; cursor:pointer;
  }

  /* RESULT */
  .result{ display:none; }
  .result.show{ display:block; }

  .signal-card{
    border-radius:14px; padding:18px; margin-bottom:12px;
    border:1px solid var(--line);
    position:relative; overflow:hidden;
  }
  .signal-card.long{ background: linear-gradient(160deg, var(--long-dim), var(--panel) 60%); border-color:#175943; }
  .signal-card.short{ background: linear-gradient(160deg, var(--short-dim), var(--panel) 60%); border-color:#66222f; }

  .sig-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .sig-label{ font-size:11px; color: var(--text-dim); }
  .sig-word{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:40px; line-height:1;
    margin-top:4px;
  }
  .long .sig-word{ color: var(--long); }
  .short .sig-word{ color: var(--short); }

  .conf-pill{
    font-size:11px; padding:6px 10px; border-radius:20px; white-space:nowrap;
    background: rgba(255,255,255,0.06); border:1px solid var(--line);
  }

  .entry-line{ margin-top:12px; font-size:12.5px; color:var(--text-dim); }
  .entry-line b{ color: var(--text); font-size:14px; }

  .levels{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:14px; }
  .lvl-box{ background: rgba(0,0,0,0.25); border-radius:10px; padding:9px 11px; border:1px solid var(--line); }
  .lvl-box .k{ font-size:10.5px; color:var(--text-dim); margin-bottom:3px; }
  .lvl-box .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
  .lvl-box.tp .v{ color: var(--long); }
  .lvl-box.sl .v{ color: var(--short); }

  .lead-panel{
    background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px;
  }
  .lead-panel-head{ font-size:11px; color:var(--text-dim); margin-bottom:9px; }
  .lead-row{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
  .lead-chip{
    border-radius:10px; padding:9px 6px; text-align:center; border:1px solid var(--line);
    background: rgba(0,0,0,0.25);
  }
  .lead-chip .lead-name{ font-size:10px; color:var(--text-dim); margin-bottom:5px; }
  .lead-chip .lead-val{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; }
  .lead-chip.long .lead-val{ color: var(--long); }
  .lead-chip.short .lead-val{ color: var(--short); }
  .lead-chip.neutral .lead-val{ color: var(--neutral); }

  .verdict{
    margin-top:12px; font-size:12.5px; line-height:1.4; color: var(--text);
    padding-top:12px; border-top:1px dashed var(--line);
  }

  footer{ margin-top:16px; font-size:10.5px; color: var(--text-dim); line-height:1.5; text-align:center; }

<script>
const priceDisplay = document.getElementById('price');
const pressureInput = document.getElementById('pressure');
const pressureLabel = document.getElementById('pressureLabel');
const scanBtn = document.getElementById('scanBtn');
const result = document.getElementById('result');
const signalCard = document.getElementById('signalCard');
const sigWord = document.getElementById('sigWord');
const confPill = document.getElementById('confPill');
const entryPrice = document.getElementById('entryPrice');
const verdictText = document.getElementById('verdictText');
const liveDot = document.getElementById('liveDot');
const liveStatus = document.getElementById('liveStatus');
const liveTime = document.getElementById('liveTime');

const longPhrases = [
  "Импульс, объём и дивергенция сходятся в лонг 💪",
  "Опережающие сигналы тянут вверх — забираем лонг 👉",
  "Покупатели давят на опережение — лонг по рынку 🫧"
];
const shortPhrases = [
  "Импульс и объём разворачивают вниз — шорт 👇",
  "Опережающие сигналы против роста — берём шорт 🫷",
  "Продавцы давят на опережение — шорт по рынку 👣"
];

function fmt(n){ return '$' + n.toFixed(1); }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

function ema(values, period){
  const k = 2 / (period + 1);
  let emaArr = [values[0]];
  for(let i=1;i<values.length;i++){
    emaArr.push(values[i]*k + emaArr[i-1]*(1-k));
  }
  return emaArr[emaArr.length-1];
}

function tfBias(closes, shortP, longP){
  const eShort = ema(closes.slice(-Math.max(shortP*3, 20)), shortP);
  const eLong = ema(closes.slice(-Math.max(longP*3, 40)), longP);
  return (eShort - eLong) / eLong;
}

// RSI series (Wilder), returns array aligned with closes (nulls during warmup)
function computeRSISeries(closes, period){
  const gains = [], losses = [];
  for(let i=1;i<closes.length;i++){
    const diff = closes[i]-closes[i-1];
    gains.push(Math.max(diff,0));
    losses.push(Math.max(-diff,0));
  }
  const rsi = new Array(closes.length).fill(null);
  if(gains.length < period) return rsi;
  let avgGain = gains.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let avgLoss = losses.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let rs = avgLoss===0 ? 100 : avgGain/avgLoss;
  rsi[period] = 100 - (100/(1+rs));
  for(let i=period;i<gains.length;i++){
    avgGain = (avgGain*(period-1)+gains[i])/period;
    avgLoss = (avgLoss*(period-1)+losses[i])/period;
    rs = avgLoss===0 ? 100 : avgGain/avgLoss;
    rsi[i+1] = 100 - (100/(1+rs));
  }
  return rsi;
}

// pivot indices in a 1D series
function findPivotIdx(values, leftBars, rightBars, type){
  const idxs = [];
  for(let i=leftBars; i<values.length-rightBars; i++){
    let ok = true;
    for(let j=i-leftBars; j<=i+rightBars; j++){
      if(j===i) continue;
      if(type==='high' && values[j] >= values[i]) ok = false;
      if(type==='low' && values[j] <= values[i]) ok = false;
    }
    if(ok) idxs.push(i);
  }
  return idxs;
}

// Bearish/bullish divergence between price closes and RSI series
function detectDivergence(closes, rsiSeries){
  const highIdx = findPivotIdx(closes, 2, 2, 'high');
  const lowIdx = findPivotIdx(closes, 2, 2, 'low');

  if(highIdx.length >= 2){
    const i1 = highIdx[highIdx.length-2], i2 = highIdx[highIdx.length-1];
    if(rsiSeries[i1] !== null && rsiSeries[i2] !== null){
      if(closes[i2] > closes[i1] && rsiSeries[i2] < rsiSeries[i1]) return -1; // bearish divergence
    }
  }
  if(lowIdx.length >= 2){
    const i1 = lowIdx[lowIdx.length-2], i2 = lowIdx[lowIdx.length-1];
    if(rsiSeries[i1] !== null && rsiSeries[i2] !== null){
      if(closes[i2] < closes[i1] && rsiSeries[i2] > rsiSeries[i1]) return 1; // bullish divergence
    }
  }
  return 0;
}

function computeATR(highs, lows, closes, period){
  const trs = [];
  for(let i=1;i<highs.length;i++){
    const tr = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
    trs.push(tr);
  }
  const recent = trs.slice(-period);
  return recent.reduce((a,b)=>a+b,0)/recent.length;
}

let structureLevels = { resistances: [], supports: [] };
let leadingSignals = { momentum: 'neutral', divergence: 'neutral', volume: 'neutral' };
let atr1h = 0;
let lastPrice = null;
let lastPressure = 50;

async function fetchLiveData(){
  try{
    const [klRes, structRes, h4Res] = await Promise.all([
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=15m&limit=80'),
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1h&limit=200'),
      fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=4h&limit=100')
    ]);
    if(!klRes.ok || !structRes.ok || !h4Res.ok) throw new Error('klines fail');
    const klines = await klRes.json();
    const structKlines = await structRes.json();
    const h4Klines = await h4Res.json();

    const closes15 = klines.map(k => parseFloat(k[4]));
    const closes1h = structKlines.map(k => parseFloat(k[4]));
    const closes4h = h4Klines.map(k => parseFloat(k[4]));
    const price = closes15[closes15.length-1];

    // --- lagging trend context (kept as secondary confirmation, low weight) ---
    const bias15 = tfBias(closes15, 6, 20);
    const bias1h = tfBias(closes1h, 6, 20);
    const bias4h = tfBias(closes4h, 6, 20);
    const trendScore = clamp((bias15*0.2 + bias1h*0.35 + bias4h*0.45) * 3000, -1, 1);

    // --- leading signal 1: momentum / rate of change (15m) ---
    const roc = (closes15[closes15.length-1] - closes15[closes15.length-11]) / closes15[closes15.length-11];
    const momentumScore = clamp(roc * 3000, -1, 1);

    // --- leading signal 2: RSI divergence (15m) ---
    const rsiSeries = computeRSISeries(closes15, 14);
    const divergenceRaw = detectDivergence(closes15, rsiSeries); // -1, 0, 1
    const divergenceScore = divergenceRaw;

    // --- leading signal 3: taker buy/sell volume imbalance (15m, last 20 candles) ---
    const recentK = klines.slice(-20);
    const totalVol = recentK.reduce((s,k) => s + parseFloat(k[5]), 0);
    const buyVol = recentK.reduce((s,k) => s + parseFloat(k[9]), 0);
    const volRatio = totalVol > 0 ? (buyVol/totalVol - 0.5) : 0;
    const volumeScore = clamp(volRatio * 6, -1, 1);

    // combine — leading signals weighted heavier than lagging EMA trend
    const total = trendScore*0.2 + momentumScore*0.3 + divergenceScore*0.3 + volumeScore*0.2;
    const pressure = Math.max(0, Math.min(100, Math.round(50 + total*50)));

    leadingSignals = {
      momentum: momentumScore > 0.08 ? 'long' : momentumScore < -0.08 ? 'short' : 'neutral',
      divergence: divergenceRaw === 1 ? 'long' : divergenceRaw === -1 ? 'short' : 'neutral',
      volume: volumeScore > 0.12 ? 'long' : volumeScore < -0.12 ? 'short' : 'neutral'
    };

    // --- real structure: swing highs/lows from 1h candles, last ~8 days ---
    const highs1h = structKlines.map(k => parseFloat(k[2]));
    const lows1h = structKlines.map(k => parseFloat(k[3]));
    const { pivotHighs, pivotLows } = (function(){
      const ph = [], pl = [];
      for(let i=3; i<highs1h.length-3; i++){
        let isHigh = true, isLow = true;
        for(let j=i-3; j<=i+3; j++){
          if(j===i) continue;
          if(highs1h[j] >= highs1h[i]) isHigh = false;
          if(lows1h[j] <= lows1h[i]) isLow = false;
        }
        if(isHigh) ph.push(highs1h[i]);
        if(isLow) pl.push(lows1h[i]);
      }
      return { pivotHighs: ph, pivotLows: pl };
    })();

    function clusterLevels(levels, thresholdPct){
      if(levels.length === 0) return [];
      const sorted = [...levels].sort((a,b) => a-b);
      const clusters = [[sorted[0]]];
      for(let i=1; i<sorted.length; i++){
        const last = clusters[clusters.length-1];
        const avg = last.reduce((a,b)=>a+b,0) / last.length;
        if(Math.abs(sorted[i]-avg)/avg < thresholdPct){ last.push(sorted[i]); }
        else { clusters.push([sorted[i]]); }
      }
      return clusters.map(c => c.reduce((a,b)=>a+b,0)/c.length);
    }

    const clusteredHighs = clusterLevels(pivotHighs, 0.0025);
    const clusteredLows = clusterLevels(pivotLows, 0.0025);

    structureLevels = {
      resistances: clusteredHighs.filter(l => l > price).sort((a,b) => a-b),
      supports: clusteredLows.filter(l => l < price).sort((a,b) => b-a)
    };

    // ATR(1h,14) drives minimum TP/SL spacing so TP1 isn't glued to entry
    atr1h = computeATR(highs1h, lows1h, closes1h, 14);

    lastPrice = price;
    lastPressure = pressure;

    priceDisplay.textContent = price.toFixed(2);
    pressureInput.value = pressure;
    pressureInput.disabled = false;
    pressureLabel.textContent = pressure + ' / 100';

    liveDot.className = 'live-dot on';
    liveStatus.textContent = 'Live · Binance ETH';
    const now = new Date();
    liveTime.textContent = now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

    scanBtn.disabled = false;
    scanBtn.textContent = 'Сканировать → выдать сигнал';

    return true;
  }catch(err){
    liveDot.className = 'live-dot off';
    liveStatus.textContent = 'Нет связи с биржей';
    scanBtn.disabled = true;
    scanBtn.textContent = 'Нет данных';
    return false;
  }
}

function pickTargets(levels, price, minGap1, minGap2, minGap3, dirSign){
  // dirSign: +1 for long (levels above price), -1 for short (levels below price)
  const far = levels.filter(l => Math.abs(l-price) >= minGap1);
  const tp1 = far[0] ?? (price + dirSign*minGap1);
  let tp2 = far.find(l => Math.abs(l-price) >= minGap2 && l !== tp1);
  if(tp2 === undefined) tp2 = tp1 + dirSign*minGap2*0.6;
  let tp3 = far.find(l => Math.abs(l-price) >= minGap3 && l !== tp1 && l !== tp2);
  if(tp3 === undefined) tp3 = tp2 + dirSign*minGap3*0.6;
  return [tp1, tp2, tp3];
}

function runScan(){
  if(lastPrice === null) return;
  const price = lastPrice;
  const pressure = lastPressure;
  const isLong = pressure >= 50;
  const strength = Math.abs(pressure - 50) / 50;
  const conf = Math.round(60 + strength * 35);

  signalCard.className = 'signal-card ' + (isLong ? 'long' : 'short');
  sigWord.textContent = isLong ? 'LONG' : 'SHORT';
  confPill.textContent = 'увер. ' + conf + '%';
  entryPrice.textContent = fmt(price);

  // ATR-based minimum spacing so TP1 never sits glued to entry
  const minGap1 = atr1h * 0.6;
  const minGap2 = atr1h * 1.3;
  const minGap3 = atr1h * 2.2;
  const slGap   = atr1h * 0.7;

  const { resistances, supports } = structureLevels;
  let tp1, tp2, tp3, sl;

  if(isLong){
    [tp1, tp2, tp3] = pickTargets(resistances, price, minGap1, minGap2, minGap3, 1);
    const validSupports = supports.filter(l => Math.abs(l-price) >= slGap);
    sl = validSupports[0] ? validSupports[0] * 0.998 : price - slGap;
  } else {
    [tp1, tp2, tp3] = pickTargets(supports, price, minGap1, minGap2, minGap3, -1);
    const validResistances = resistances.filter(l => Math.abs(l-price) >= slGap);
    sl = validResistances[0] ? validResistances[0] * 1.002 : price + slGap;
  }

  document.getElementById('tp1').textContent = fmt(tp1);
  document.getElementById('tp2').textContent = fmt(tp2);
  document.getElementById('tp3').textContent = fmt(tp3);
  document.getElementById('sl').textContent  = fmt(sl);

  const phrases = isLong ? longPhrases : shortPhrases;
  verdictText.textContent = phrases[Math.floor(Math.random() * phrases.length)];

  const leadNames = { momentum: 'Momentum', divergence: 'Дивергенция', volume: 'Объём' };
  const leadRow = document.getElementById('leadRow');
  leadRow.innerHTML = '';
  Object.keys(leadNames).forEach(key => {
    const dir = leadingSignals[key];
    const chip = document.createElement('div');
    chip.className = 'lead-chip ' + dir;
    const label = dir === 'long' ? 'LONG' : dir === 'short' ? 'SHORT' : 'НЕЙТР';
    chip.innerHTML = `<div class="lead-name">${leadNames[key]}</div><div class="lead-val">${label}</div>`;
    leadRow.appendChild(chip);
  });

  result.classList.add('show');
}

scanBtn.addEventListener('click', runScan);

fetchLiveData();
setInterval(fetchLiveData, 20000);

/* ---- PWA install prompt ---- */
let deferredPrompt = null;
const installHint = document.getElementById('installHint');
const installBtn = document.getElementById('installBtn');
const installText = document.getElementById('installText');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installHint.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installHint.classList.remove('show');
});

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (isIOS && !isStandalone) {
  installText.textContent = 'Установи: "Поделиться" → "На экран Домой" 📲';
  installBtn.style.display = 'none';
  installHint.classList.add('show');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
